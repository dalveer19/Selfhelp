<template>
	<div class="slds-grid slds-grid_align-center slds-wrap ">
		<div class=" featureDisplayComponent">
			<div class="slds-col  slds-small-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
				<div class="headingContainer">
					<h4 class="featureHeading" aria-level="2">{label_SearchbyCategory}</h4>
				</div>
				<div class="slds-grid slds-wrap"
					if:true={categoriesList}>
					<template for:each={categoriesList} for:item="category" key={category.Id}>
						<div key={category}
						class="slds-col slds-size_1-of-1 slds-small-size_1-of-1 slds-medium-size_1-of-3 slds-large-size_1-of-3">
						<a class="slds-box customBox slds-align_absolute-center slds-text-title_bold" tabindex="0"
								onclick={handleCategoryClick} name={category.name} onkeydown={handleKeyPress}>
						<div class="center">
							<div class="slds-col text-center logoWrap"><img src={category.svgImage} alt="category" /></div>
							<p class="catName">{category.label}</p>
						</div></a> 
						</div>
					</template>
				</div>
			</div>
		</div>
	</div>
