<template>
	<div if:false={modalContentLoading}>
	<section role="dialog" tabindex="0" aria-modal="true" aria-labelledby="select_program_title"
		class="slds-modal slds-modal_full slds-fade-in-open" onkeyup={keyboardHandler} onfocusout={handleFocusOut} data-index="0">
		<div class="slds-modal__container1"  data-id="articleModal"> 
			<span class="sr-only" id="select_program_title">{label_Search_topics_and_get_answers}</span>
			<div class="wrapperModal" onclick={ignore}>
				<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse closeWrap" onclick={handleCloseClick} onkeydown={handleCloseKeyDown} aria-label={label_close}>
			<i class="fa-solid fa-xmark closeIcon"></i>
			</button>
			</div>

			<div class="slds-modal__header" onclick={ignore}>
				<div class="headerContainer">
					<template if:true={clientThere}>
						<lightning-layout-item class="slds-text-align_left" flexibility="auto" size="10">
							<p class="testingProName">
                        {label_Testing_Program} {clientName} &nbsp; 
                        <a href="javascript:void(0);" onclick={openModal} class="changeLink">{label_hyperlink}<span class="slds-assistive-text">{clientName}</span></a>
                        </p>
						</lightning-layout-item>
					</template>

					<template if:false={clientThere}>
						<div
							class="slds-grid slds-wrap btnContainer slds-grid_vertical-align-center slds-grid_align-left" role="group" aria-label={label_Search_topics_and_get_answers}>
							<div class="slds-col flexNone pr15 mobpb1 ">
								<lightning-input type="radio" name="programSelection"
									label={label_I_want_to_search_across_all_programs} value="searchAllPrograms"
									class="modalOptions" checked={isSelectedProgramSearchAllPrograms}>
								</lightning-input>
							</div>
							<div class="slds-col flexNone">
								<lightning-input type="radio" name="programSelection"
									label={label_I_know_my_testing_program} class="modalOptions" value="iknow"
									onclick={handleProgramSelection} 
									onkeydown={handleProgramSelectionKeydown}>
								</lightning-input>
							</div>
						</div>
					</template>
					<lightning-layout>
						<lightning-layout-item class="slds-text-align_left overlaySearch" flexibility="auto" size="12">
							<!-- Add your c-search-Bar-With-Suggestions-Child-V1 component here -->
							<c-search-bar-with-suggestions-child-v1 client-code-from-parent={idOfClient}>
							</c-search-bar-with-suggestions-child-v1>
						</lightning-layout-item>
					</lightning-layout>
				</div>
			</div>

			<template if:true={helpTopicsExist}>
				<div class="commonHelpContainer" onclick={ignore}>
					<footer class="slds-modal__footer" onclick={ignore}>
						<div class="helpTopics">
							<h5 class="cmnHelpTopicsHeading">{label_CommonHelpTopics}</h5>
							<div>
								<div class="slds-grid slds-wrap">
									<template for:each={helpTopics} for:item="topic">
										<div class="slds-col slds-large-size_4-of-12 slds-size_1-of-1 pb1"
											key={topic.Id}>
											<a href={topic.url} target={topic.target} class="helpLink">{topic.label}
												<template if:true={topic.externalLink}>
													<i class="fa-regular fa-arrow-up-right-from-square arrowUpRight" aria-label={label_Opens_In_New_Window}></i>
												</template>
											</a>
										</div>
									</template>
								</div>
							</div>
						</div>
					</footer>
				</div>
			</template>



	</div> 

	</section>
	<div class="slds-backdrop slds-backdrop_open" role="presentation" data-index="1" tabindex="0"></div>
	</div> 
	<template if:true={modalContentLoading}>
		<div class="slds-backdrop slds-backdrop_open custom" role="presentation"></div>
		<div class="loadingCon global siteforceLoadingBalls customBalls">
			<div class="lds-ring">
				<div></div>
				<div></div>
				<div></div>
				<div></div>
			</div>
		</div>
	</template>
</template>
